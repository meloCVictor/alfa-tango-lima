<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Usuários da plataforma - Curso Alvorada</title>
    <meta name="robots" content="noindex">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="css/custom.css">
</head>

<body>
    <header style="background: white; border-bottom: 3px solid var(--verde-principal); padding: 14px 0;">
        <div class="container flex items-center justify-between" style="flex-wrap: wrap; gap: 10px;">
            <a href="index.html" style="font-weight: 800; color: var(--verde-principal); font-size: 1.05rem; text-decoration: none;">ADMIN · USUÁRIOS</a>
            <button type="button" class="nav-toggle" data-target="nav-admin-usuarios" aria-label="Abrir menu">☰</button>
            <nav class="nav-links" id="nav-admin-usuarios">
                <span id="nome-usuario-logado" style="color: var(--cinza-claro); font-size: 0.9rem;"></span>
                <a href="admin.html" style="color: var(--verde-principal); font-weight: 600; text-decoration: none; font-size: 0.9rem;">Alunos</a>
                <a href="admin-perguntas.html" style="color: var(--verde-principal); font-weight: 600; text-decoration: none; font-size: 0.9rem;">Perguntas</a>
                <button type="button" id="btn-sair" style="background: none; border: 1px solid var(--verde-principal); color: var(--verde-principal); font-weight: 600; padding: 8px 16px; border-radius: 8px; cursor: pointer;">Sair</button>
            </nav>
        </div>
    </header>

    <div class="container" style="max-width: 900px; padding-top: 40px; padding-bottom: 60px;">
        <div id="carregando" style="text-align: center; padding: 60px 0; color: var(--cinza-claro);">Carregando...</div>

        <div id="sem-permissao" style="display: none; text-align: center; padding: 60px 0;">
            <div style="font-size: 2.5rem; margin-bottom: 12px;">🔒</div>
            <h2 style="color: var(--verde-escuro);">Acesso restrito</h2>
        </div>

        <div id="painel" style="display: none;">
            <h1 style="font-size: 1.5rem; color: var(--verde-escuro); margin-bottom: 8px;">Usuários da plataforma</h1>
            <p style="color: var(--cinza-claro); font-size: 0.9rem; margin-bottom: 20px;">
                Todas as pessoas cadastradas (em qualquer curso). Use com cuidado a opção de tornar alguém administrador.
            </p>

            <input type="text" id="busca-usuario" class="form-input" placeholder="Buscar por nome ou e-mail..." style="max-width: 360px; margin-bottom: 20px;">

            <div id="lista-usuarios" style="display: flex; flex-direction: column; gap: 12px;"></div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase-config.js"></script>
    <script src="js/nav.js"></script>
    <script src="js/admin-usuarios.js"></script>
</body>

</html>
