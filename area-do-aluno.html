<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Área do Aluno - Curso Alvorada</title>
    <meta name="robots" content="noindex">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="css/custom.css">
</head>

<body>
    <header style="background: white; border-bottom: 3px solid var(--verde-principal); padding: 14px 0;">
        <div class="container flex items-center justify-between" style="flex-wrap: wrap; gap: 10px;">
            <a href="index.html" style="font-weight: 800; color: var(--verde-principal); font-size: 1.05rem; text-decoration: none;">CURSO ALVORADA</a>
            <button type="button" class="nav-toggle" data-target="nav-aluno" aria-label="Abrir menu">☰</button>
            <nav class="nav-links" id="nav-aluno">
                <span id="nome-usuario-logado" style="color: var(--cinza-claro); font-size: 0.9rem;"></span>
                <button type="button" id="btn-sair" style="background: none; border: 1px solid var(--verde-principal); color: var(--verde-principal); font-weight: 600; padding: 8px 16px; border-radius: 8px; cursor: pointer;">Sair</button>
            </nav>
        </div>
    </header>

    <div class="container" style="max-width: 800px; padding-top: 40px; padding-bottom: 60px;">
        <div id="carregando" style="text-align: center; padding: 60px 0; color: var(--cinza-claro);">Carregando...</div>

        <div id="catalogo" style="display: none;">
            <h1 id="saudacao" style="font-size: 1.6rem; color: var(--verde-escuro); margin-bottom: 24px;"></h1>
            <div id="lista-cursos" style="display: flex; flex-direction: column; gap: 16px;"></div>
        </div>
    </div>

    <!-- Modal de compra/pagamento de um curso (usado quando o aluno compra outro curso direto por aqui) -->
    <div id="modal-pix-compra"
        style="display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 9999; align-items: center; justify-content: center; padding: 20px;">
        <div style="background: white; border-radius: 16px; max-width: 480px; width: 100%; padding: 32px; text-align: center; max-height: 90vh; overflow-y: auto;">
            <button onclick="document.getElementById('modal-pix-compra').style.display='none'"
                style="float: right; background: none; border: none; font-size: 1.5rem; color: #999; cursor: pointer;">×</button>

            <h3 id="titulo-modal-compra" style="font-size: 1.4rem; color: var(--verde-escuro); margin-bottom: 8px;">Pague via PIX</h3>
            <p style="color: var(--cinza-claro); font-size: 0.9rem; margin-bottom: 24px;">
                Escaneie o QR Code abaixo ou copie o código PIX. Seu acesso será liberado após a confirmação.
            </p>

            <div class="pix-box" style="margin-bottom: 20px;">
                <img id="qr-code-compra" src="" alt="QR Code PIX" style="width: 200px; height: 200px; margin: 0 auto;">
                <p style="font-size: 0.8rem; color: var(--cinza-claro); margin-top: 8px;">Escaneie com o app do seu banco</p>
            </div>

            <div style="margin-bottom: 20px;">
                <label style="display: block; font-size: 0.85rem; font-weight: 600; color: var(--verde-escuro); margin-bottom: 6px;">Ou copie o código PIX:</label>
                <div class="pix-codigo" id="pix-codigo-compra"></div>
                <button onclick="copiarPixCompra()"
                    style="background: var(--verde-principal); color: white; border: none; padding: 8px 20px; border-radius: 6px; font-weight: 600; cursor: pointer; margin-top: 8px; font-size: 0.9rem;">
                    📋 COPIAR CÓDIGO
                </button>
            </div>

            <a id="btn-whatsapp-compra" href="#" target="_blank"
                style="display: block; background: #25D366; color: white; font-weight: 700; padding: 14px; border-radius: 10px; text-decoration: none; font-size: 0.95rem; margin-top: 8px;">
                📱 ENVIAR COMPROVANTE NO WHATSAPP
            </a>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase-config.js"></script>
    <script src="js/pix.js"></script>
    <script src="js/nav.js"></script>
    <script src="js/area-do-aluno.js"></script>
</body>

</html>
